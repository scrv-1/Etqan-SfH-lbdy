<!doctype html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#f5f3ed">
    <title>Etqan</title>
    <style>
      :root {
        color-scheme: light;
        --paper: #f5f3ed;
        --ink: #253d35;
        --muted: #53645c;
        --accent: #315b4a;
        --accent-hover: #284c3d;
        --focus: #a05d29;
      }

      * {
        box-sizing: border-box;
      }

      html {
        min-width: 320px;
        min-height: 100%;
        background: var(--paper);
      }

      body {
        min-height: 100vh;
        min-height: 100dvh;
        margin: 0;
        padding: clamp(24px, 6vw, 72px);
        display: grid;
        place-items: center;
        background: var(--paper);
        color: var(--ink);
        font-family: system-ui, -apple-system, "Segoe UI", Tahoma, sans-serif;
        -webkit-font-smoothing: antialiased;
      }

      main {
        width: min(100%, 620px);
        padding-block: 24px;
        text-align: center;
      }

      .brand {
        margin: 0 0 clamp(36px, 7vh, 64px);
        color: var(--accent);
        direction: ltr;
        font-size: 0.92rem;
        font-weight: 650;
        letter-spacing: 0.16em;
      }

      h1 {
        margin: 0;
        font-size: clamp(2.25rem, 8vw, 4.25rem);
        font-weight: 650;
        letter-spacing: -0.055em;
        line-height: 1.35;
        text-wrap: balance;
      }

      .intro {
        margin: 20px 0 34px;
        color: var(--muted);
        font-size: clamp(1.05rem, 3.2vw, 1.25rem);
        font-weight: 400;
        line-height: 1.9;
        text-wrap: balance;
      }

      button {
        min-width: 148px;
        min-height: 54px;
        padding: 13px 32px;
        border: 0;
        border-radius: 4px;
        background: var(--accent);
        color: #fffdf7;
        font: inherit;
        font-size: 1rem;
        font-weight: 600;
        cursor: pointer;
      }

      button:hover {
        background: var(--accent-hover);
      }

      button:focus-visible {
        outline: 3px solid var(--focus);
        outline-offset: 4px;
      }

      @media (max-width: 480px) {
        body {
          padding: 24px;
        }

        main {
          padding-block: 12px;
        }

        .brand {
          margin-bottom: 40px;
        }

        .intro {
          margin-top: 16px;
          margin-bottom: 28px;
        }
      }
    </style>
  </head>
  <body>
    <main>
      <p class="brand" lang="en">Etqan</p>
      <h1>الإتقان يبدأ من هنا</h1>
      <p class="intro">ابدأ رحلتك نحو عملٍ أكثر إتقانًا.</p>
      <button type="button">ابدأ</button>
    </main>
  </body>
</html>
